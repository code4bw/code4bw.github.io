name: Deploy to Github Pages
on:
  push:
    branches: ["main"]

jobs:
  deploy:
    uses: "code4bw/code4bw.github.io/blob/main/.github/workflows/github_pages.yml@main"
    permissions:
      contents: "read"
      pages: "write"
      id-token: "write"
    with:
      settings: "publishconf.py"
      requirements: '-r requirements.txt'
