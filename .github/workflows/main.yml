name: Deploy static HTML to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/check-site.mjs'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TEMP: ${{ github.workspace }}/Temp
      TMP: ${{ github.workspace }}/Temp
      TMPDIR: ${{ github.workspace }}/Temp
    steps:
      - uses: actions/checkout@v4
      - name: Prepare temporary directory
        run: mkdir -p "$TEMP"
      - name: Check HTML and local links
        run: node scripts/check-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
